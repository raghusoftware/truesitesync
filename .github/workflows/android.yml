name: Android APK

# Builds the native field client (android/) into an installable debug APK and
# uploads it as a downloadable workflow artifact. Gradle is provisioned by the
# action, so the (uncommitted) Gradle wrapper jar is not required.

on:
  push:
    branches:
      - claude/great-euler-8ucmg5
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          # Add SUPABASE_ANON_KEY under Settings -> Secrets and variables ->
          # Actions. Without it the APK still builds, but sign-in/sync are off.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truesitesync-field-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
