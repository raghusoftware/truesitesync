name: Build Desktop App

on:
  workflow_dispatch:   # manual trigger
  push:
    tags: ['v*']       # a version tag also builds & publishes the desktop exe
    branches:
      - 'release/**'      # pushing a release/<ver> branch also builds & publishes
      - 'exe-release/**'  # desktop-ONLY release channel (does NOT trigger the APK/AAB builds)

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npx --yes tailwindcss@3.4.4 -c tools/tailwind.config.cjs -i tools/tailwind.input.css -o css/tailwind.css --minify

      - name: Build and publish Windows exe
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: TrueSiteSync-Windows
          path: |
            dist/TrueSiteSync-Setup.exe
            dist/latest.yml
