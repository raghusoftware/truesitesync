name: Build Android AAB (Play Store)

# Produces a SIGNED Android App Bundle (.aab) for Google Play upload.
#
# Signing key:
#   • If the repo secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#     ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are set, the bundle is signed with
#     THAT keystore — use this for real Play Store uploads (the upload key must
#     stay the same across releases).
#   • If they are NOT set, the workflow generates a throwaway keystore so a signed
#     .aab is still produced (fine for a first upload / testing, but Play will
#     reject future updates unless you switch to a stable keystore via secrets).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override the Play version code (leave empty for the automatic one)'
        required: false
        default: ''
  push:
    tags: ['v*']
    branches:
      - 'release/**'
      - 'aab-release/**'  # Play-Store-ONLY release channel (does NOT trigger the EXE/APK builds)

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'truesitesync' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'truesite' }}
      KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD || 'truesitesync' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets
        run: |
          npx --yes tailwindcss@3.4.4 -c tools/tailwind.config.cjs -i tools/tailwind.input.css -o css/tailwind.css --minify
          mkdir -p www
          cp app.html www/index.html
          cp -r css www/
          cp -r js www/
          cp -r assets www/

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/file-opener@6 @capacitor/app@6 @capacitor/geolocation@6 @codetrix-studio/capacitor-google-auth@3.4.0-rc.4 capacitor-voice-recorder@5 --legacy-peer-deps

      - name: Confirm Google Sign-In client ID
        run: grep -A3 '"GoogleAuth"' capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Enable R8 (code shrink + obfuscation) with Capacitor-safe rules
        run: |
          # Turn on R8 for the release build (Capacitor defaults it OFF). This
          # shrinks/obfuscates the native code AND makes AGP generate mapping.txt,
          # which it auto-embeds in the .aab so Play can de-obfuscate crashes/ANRs.
          sed -i -E 's/minifyEnabled false/minifyEnabled true/' android/app/build.gradle
          grep -n 'minifyEnabled' android/app/build.gradle || echo "::warning::minifyEnabled line not found — R8 may not be enabled"
          # Full R8 optimisation (Play: "Improve memory and performance with R8 optimization"):
          # the template's proguard-android.txt carries -dontoptimize; the -optimize file does not.
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" android/app/build.gradle
          grep -q 'proguard-android-optimize.txt' android/app/build.gradle || { echo '::error::R8 optimize rules not applied'; exit 1; }
          # Keep rules so R8 never strips/renames the reflection-instantiated
          # Capacitor bridge, its plugins, or the JS<->native interface.
          cat >> android/app/proguard-rules.pro << 'PROGUARD'

          # ── True Site Sync — Capacitor-safe R8 keep rules ──
          -keep public class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin public class * { *; }
          -keep class com.getcapacitor.** { *; }
          -keep class com.getcapacitor.annotation.** { *; }
          -keep class org.apache.cordova.** { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,JavascriptInterface
          -dontwarn com.getcapacitor.**
          -dontwarn org.apache.cordova.**
          PROGUARD
          echo "----- proguard-rules.pro -----"; cat android/app/proguard-rules.pro

      - name: Target Android 16 (API 36) — required by Google Play
        run: |
          # Play requires targetSdk >= 36. Capacitor 6 defaults to 34.
          sed -i -E 's/(compileSdkVersion = )[0-9]+/\136/' android/variables.gradle
          sed -i -E 's/(targetSdkVersion = )[0-9]+/\136/' android/variables.gradle
          # Play automatic protection requires minSdk >= 24 (Android 7.0); Capacitor 6 defaults to 22.
          sed -i -E 's/(minSdkVersion = )[0-9]+/\124/' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle || { echo '::error::minSdkVersion was not set to 24'; exit 1; }
          # AGP 8.2 (Capacitor 6) warns on compileSdk 36 — suppress so the build passes.
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "----- android/variables.gradle -----"; cat android/variables.gradle

      - name: Set version code & name
        run: |
          # Capacitor hardcodes versionCode 1; Play needs it to strictly increase.
          # major*1,000,000 + minor*1,000 + patch, so a patch above 99 can never spill
          # into the minor digits (the old *10000/*100 scheme made 1.6.171 -> 10771, and
          # 1.7.0 would have gone DOWN to 10700):
          #   1.6.174 -> 1006174,  1.7.0 -> 1007000,  2.0.0 -> 2000000
          # (all above every code Play holds so far; the highest was 11774).
          # Prefer package.json (works on manual dispatch too); fall back to the tag.
          VN="$(node -p "require('./package.json').version" 2>/dev/null || echo "${GITHUB_REF_NAME#v}")"
          if echo "$VN" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            IFS='.' read -r MA MI PA <<< "$VN"
            CODE=$(( MA * 1000000 + MI * 1000 + PA ))
          else
            VN="1.0.${GITHUB_RUN_NUMBER}"
            CODE=$(( 1000000 + GITHUB_RUN_NUMBER ))
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then CODE="${{ github.event.inputs.version_code }}"; fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Add Firebase Analytics (only when google-services.json is provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::notice::No google-services.json (firebase/google-services.json or GOOGLE_SERVICES_JSON secret) - building without Firebase Analytics"
            exit 0
          fi
          node -e "const j=require('./android/app/google-services.json');const ok=(j.client||[]).some(c=>((c.client_info||{}).android_client_info||{}).package_name==='com.truesitesync.app');if(!ok){console.error('google-services.json has no client for com.truesitesync.app');process.exit(1)}" || exit 1
          grep -q "com.google.gms:google-services" android/build.gradle || { echo '::error::google-services classpath missing from android/build.gradle'; exit 1; }
          grep -q "com.google.gms.google-services" android/app/build.gradle || { echo '::error::google-services plugin hook missing from android/app/build.gradle'; exit 1; }
          cat >> android/app/build.gradle << 'GRADLE'

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-analytics'
          }
          GRADLE
          echo "----- Firebase added -----"; tail -5 android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app launcher icon from logo (assets/icon.png)
        run: |
          npm install --no-save @capacitor/assets@3 || true
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' || echo "::warning::icon generation failed — falling back to default icon"
          echo "----- generated launcher icons -----"
          find android/app/src/main/res -path '*mipmap*ic_launcher*' | head -20 || true

      - name: Configure Android (in-app links + HTTPS), same as the APK build
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Save exports to Documents/TrueSiteSync on Android 10 and older (11+ needs no permission)
          grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST" || sed -i '0,/<manifest[^>]*>/s##&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />#' "$MANIFEST"
          # Site-capture permissions for the Execution Intelligence platform (photos / voice / GPS)
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$MANIFEST"
          fi
          # Fallback: if the INTERNET permission line was absent, inject right after the opening <manifest> tag.
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s##&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$MANIFEST"
          fi
                 if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s##&\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <uses-feature android:name="android.hardware.location" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' "$MANIFEST"
          fi
          echo "----- manifest permissions -----"; grep 'uses-permission' "$MANIFEST" || true
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          mkdir -p android/app/src/main/java/com/truesitesync/app
          # Edge-to-edge done natively (Play: required for targetSdk 35+, and the StatusBar
          # plugin's colour APIs are deprecated): the WebView keeps clear of the status bar,
          # navigation bar, display cut-out and the keyboard (Android 15+ no longer resizes
          # the window for the keyboard on its own), and the strips behind the bars are
          # painted here — dark behind the status bar, white behind the navigation bar.
          cat > android/app/src/main/java/com/truesitesync/app/MainActivity.java << 'JAVAEOF'
          package com.truesitesync.app;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.LayerDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.activity.EdgeToEdge;
          import androidx.activity.SystemBarStyle;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              private static final int STATUS_STRIP = Color.parseColor("#0f172a");
              private static final int NAV_STRIP = Color.WHITE;
              private boolean insetsReady = false;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  // Light icons on the dark status strip, dark icons on the white navigation strip.
                  EdgeToEdge.enable(this, SystemBarStyle.dark(Color.TRANSPARENT), SystemBarStyle.light(Color.TRANSPARENT, Color.TRANSPARENT));
                  super.onCreate(savedInstanceState);
                  setupInsets();
              }
              private void setupInsets() {
                  if (insetsReady || getBridge() == null) return;
                  final WebView webView = getBridge().getWebView();
                  if (webView == null || !(webView.getParent() instanceof View)) return;
                  insetsReady = true;
                  final View parent = (View) webView.getParent();
                  ViewCompat.setOnApplyWindowInsetsListener(parent, (p, insets) -> {
                      Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                      ViewGroup.MarginLayoutParams lp = (ViewGroup.MarginLayoutParams) webView.getLayoutParams();
                      lp.topMargin = bars.top;
                      lp.leftMargin = bars.left;
                      lp.rightMargin = bars.right;
                      lp.bottomMargin = Math.max(bars.bottom, ime.bottom);
                      webView.setLayoutParams(lp);
                      LayerDrawable bg = new LayerDrawable(new Drawable[] { new ColorDrawable(NAV_STRIP), new ColorDrawable(STATUS_STRIP) });
                      bg.setLayerGravity(1, Gravity.TOP | Gravity.FILL_HORIZONTAL);
                      bg.setLayerHeight(1, Math.max(1, bars.top));
                      p.setBackground(bg);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(parent);
              }
              @Override public void onStart() {
                  super.onStart();
                  setupInsets();
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setUserAgentString(settings.getUserAgentString() + " TrueSiteSync-Android/1.4.0");
                  }
              }
          }
          JAVAEOF
          # EdgeToEdge / SystemBarStyle need androidx.activity 1.8+.
          cat >> android/app/build.gradle << 'GRADLE'

          dependencies {
              implementation 'androidx.activity:activity:1.9.3'
          }
          GRADLE
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors><certificates src="system" /></trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="true">supabase.co</domain>
                  <domain includeSubdomains="true">googleapis.com</domain>
                  <domain includeSubdomains="true">github.com</domain>
              </domain-config>
          </network-security-config>
          XMLEOF
          sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"

      - name: Prepare signing keystore
        working-directory: android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from repository secret (stable / Play-Store ready)."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — generating a throwaway keystore. Fine for a first/test upload, but add a stable keystore secret before publishing updates."
            keytool -genkeypair -v -keystore upload.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=True Site Sync, O=True Site Sync, L=Vadodara, ST=Gujarat, C=IN"
          fi

      - name: Build release bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign the bundle
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore app/upload.keystore -storetype pkcs12 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          cp "$AAB" TrueSiteSync.aab
          jarsigner -verify -verbose "$AAB" | tail -3

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueSiteSync-AAB
          path: android/TrueSiteSync.aab

      - name: Upload R8 deobfuscation (mapping) file
        uses: actions/upload-artifact@v4
        with:
          name: TrueSiteSync-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Read app version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Attach the signed AAB to the v<version> release on tag AND manual dispatch,
      # so it's downloadable for the Play Store upload without needing a pushed tag.
      - name: Attach AAB to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: android/TrueSiteSync.aab
