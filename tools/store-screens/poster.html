<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#FBF3EC;position:relative;color:#1f1a17}
.band{position:absolute;left:0;right:0;top:1230px;bottom:0;background:linear-gradient(120deg,#B92C18 0%,#D6402C 45%,#EF8420 100%)}
.band:after{content:"";position:absolute;inset:0;opacity:.10;background:repeating-linear-gradient(-45deg,#fff 0 3px,transparent 3px 26px)}
.grid{position:absolute;left:0;right:0;top:0;height:1230px;opacity:.5;background-image:radial-gradient(#e9d7c8 1.6px,transparent 1.6px);background-size:34px 34px;mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent)}
.brand{position:absolute;top:58px;left:60px;display:flex;align-items:center;gap:16px}
.brand img{width:86px;height:86px;object-fit:contain}
.brand b{font-size:44px;font-weight:800;letter-spacing:-1px}
.brand b span{color:#D6402C}
.hd{position:absolute;top:210px;left:50px;right:50px;text-align:center}
.hd h1{font-weight:900;letter-spacing:-3px;line-height:1.02;white-space:nowrap}
.hd .l1{color:#1f1a17}.hd .l2{color:#D6402C}
.hd p{margin:30px auto 0;font-size:40px;line-height:1.3;color:#3d3632;font-weight:500;max-width:920px}
.phone{position:absolute;left:50%;top:700px;transform:translateX(-50%);width:640px;height:1340px;background:#111;border-radius:96px;padding:20px;box-shadow:0 40px 80px rgba(80,20,10,.35),inset 0 0 0 3px #3a3a3a}
.phone:before,.phone:after{content:"";position:absolute;background:#2a2a2a;width:8px;border-radius:4px}
.phone:before{left:-8px;top:250px;height:110px}.phone:after{right:-8px;top:300px;height:170px}
.scr{width:600px;height:1300px;border-radius:78px;overflow:hidden;background:#eef1f6;position:relative}
.sb{height:76px;background:linear-gradient(120deg,#c2321f,#d6402c 45%,#ef8420);display:flex;align-items:flex-end;justify-content:space-between;padding:0 46px 12px;color:#fff;font-weight:700;font-size:26px}
.isl{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:190px;height:54px;background:#000;border-radius:30px;z-index:3}
.sb i{font-style:normal;display:flex;align-items:center;gap:8px}
.scr img.app{display:block;width:600px}
.card{position:absolute;top:1300px;z-index:5;background:#fff;border-radius:34px;padding:30px 36px;box-shadow:0 24px 60px rgba(60,20,10,.28);min-width:380px;max-width:470px}
.card.left{left:36px}.card.right{right:36px}
.card .ic{width:92px;height:92px;border-radius:24px;background:#FDF1ED;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:18px}
.card .v{font-size:58px;font-weight:900;letter-spacing:-1.5px;color:#1f1a17;line-height:1.05}
.card .lb{font-size:30px;color:#6b625c;margin-top:8px;font-weight:500;line-height:1.25}
</style></head><body>
<div class="grid"></div><div class="band"></div>
<div class="brand"><img src="logo.png" alt=""><b>True Site <span>Sync</span></b></div>
<div class="hd"><h1 class="l1" id="l1"></h1><h1 class="l2" id="l2"></h1><p id="sub"></p></div>
<div class="phone"><div class="scr"><div class="isl"></div><div class="sb"><span>9:41</span><i><svg width="34" height="22" viewBox="0 0 34 22" fill="#fff"><rect x="0" y="14" width="6" height="8" rx="1.5"/><rect x="9" y="10" width="6" height="12" rx="1.5"/><rect x="18" y="5" width="6" height="17" rx="1.5"/><rect x="27" y="0" width="6" height="22" rx="1.5"/></svg> <svg width="30" height="22" viewBox="0 0 30 22" fill="#fff"><path d="M15 21l4.5-5.2a6.5 6.5 0 0 0-9 0z"/><path d="M15 5.5c4.3 0 8.2 1.6 11.2 4.3l-3 3.4A12 12 0 0 0 15 10a12 12 0 0 0-8.2 3.2l-3-3.4A16.6 16.6 0 0 1 15 5.5z" opacity=".95"/></svg> <svg width="46" height="22" viewBox="0 0 46 22"><rect x="1" y="1" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><rect x="4" y="4" width="30" height="14" rx="3.5" fill="#fff"/><rect x="41" y="7" width="3" height="8" rx="1.5" fill="#fff" opacity=".6"/></svg></i></div><img class="app" id="app"></div></div>
<div class="card" id="card"><div class="ic" id="cic"></div><div class="v" id="cv"></div><div class="lb" id="cl"></div></div>
<script>
const D = __DATA__;
const $ = (id) => document.getElementById(id);
$('l1').textContent = D.l1; $('l2').textContent = D.l2; $('sub').textContent = D.sub;
$('app').src = 'raw/' + D.img + '.png';
$('card').classList.add(D.card.side); $('cic').textContent = D.card.ic; $('cv').textContent = D.card.val; $('cl').textContent = D.card.lab;
// one font size for both headline lines, as big as fits 980px
let fs = 104; const fit = () => { ['l1','l2'].forEach(i => $(i).style.fontSize = fs + 'px'); return Math.max($('l1').scrollWidth, $('l2').scrollWidth) <= 980; };
while (!fit() && fs > 60) fs -= 2;
</script></body></html>
